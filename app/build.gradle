plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.hunsu.note'
    compileSdk 34

    defaultConfig {
        applicationId "com.hunsu.note"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "3.4"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        debug {
            // 기본 debug keystore 로 서명되어 바로 설치 가능
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

}

// Robolectric 이 android-all jar 를 받아 둘 홈 디렉터리(선택). CI 에서는 기본값을 쓴다.
tasks.withType(Test).configureEach {
    def roboHome = System.getenv('ROBOLECTRIC_HOME')
    if (roboHome != null) {
        systemProperty 'user.home', roboHome
    }
    // Robolectric 네이티브 런타임/폰트를 임시 폴더(/tmp 는 작을 수 있다)에 풀어 놓는다.
    def roboTmp = System.getenv('ROBOLECTRIC_TMP')
    if (roboTmp != null) {
        systemProperty 'java.io.tmpdir', roboTmp
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'com.google.android.material:material:1.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test:core:1.5.0'
}
